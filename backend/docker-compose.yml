version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: petpal-postgres
    environment:
      POSTGRES_DB: petpal
      POSTGRES_USER: petpal_user
      POSTGRES_PASSWORD: petpal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - petpal-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: petpal-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petpal.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - petpal-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  petpal-network:
    driver: bridge

